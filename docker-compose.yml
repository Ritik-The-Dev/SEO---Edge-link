# Local production-shaped stack: Postgres + Redis + Next.js web + BullMQ worker.
# Usage:  cp .env.example .env  (set AUTH_SECRET / CRON_SECRET)  →  docker compose up --build
#
# The web and worker containers override DATABASE_URL / REDIS_URL to reach the
# compose services; every other setting comes from .env.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edgelink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d edgelink']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: web
    command: ['npx', 'prisma', 'db', 'push', '--skip-generate']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/edgelink?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  web:
    build:
      context: .
      target: web
    env_file: .env
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/edgelink?schema=public
      REDIS_URL: redis://redis:6379
      REPORT_DIR: /app/.data/reports
    ports:
      - '3000:3000'
    volumes:
      - reports:/app/.data/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    command: ['sh', '-c', 'npx prisma db push --skip-generate && npm run worker']
    env_file: .env
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/edgelink?schema=public
      REDIS_URL: redis://redis:6379
      REPORT_DIR: /app/.data/reports
    volumes:
      - reports:/app/.data/reports
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  reports:
